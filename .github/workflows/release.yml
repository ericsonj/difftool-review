name: Release

on:
  release:
    types: [published]

concurrency: release

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tag must be "v" + package.json version. The Marketplace has no
      # semver pre-release versions, so channels use the minor number:
      # even minor = release, odd minor = pre-release.
      - name: Check version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ "$PRERELEASE" = "true" ] && [ $((MINOR % 2)) -eq 0 ]; then
            echo "::error::Pre-release $VERSION needs an odd minor version"
            exit 1
          fi
          if [ "$PRERELEASE" != "true" ] && [ $((MINOR % 2)) -eq 1 ]; then
            echo "::error::Release $VERSION needs an even minor version"
            exit 1
          fi
          echo "vsix=difftool-review-$VERSION.vsix" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" = "true" ]; then
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
          fi

      # One package, published to the Marketplace and attached to the release.
      - name: Package
        run: pnpm exec vsce package --no-dependencies ${{ steps.version.outputs.flag }} --out "${{ steps.version.outputs.vsix }}"

      - name: Publish to Visual Studio Marketplace
        run: pnpm exec vsce publish --packagePath "${{ steps.version.outputs.vsix }}" ${{ steps.version.outputs.flag }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Attach to GitHub release
        run: gh release upload "$TAG" "${{ steps.version.outputs.vsix }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
